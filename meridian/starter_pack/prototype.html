</style></head><body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">M</div><div><div class="brand-name">MERIDIAN</div><div class="brand-sub">Intelligence platform</div></div></div>
<div class="mode-label">Active workspace</div><div class="mode-switch"><button class="mode-btn active" id="riskMode" onclick="setMode('risk')"><span class="mi">◈</span>Risk &amp; Compliance</button><button class="mode-btn" id="intelMode" onclick="setMode('intel')"><span class="mi">⌘</span>Intelligence</button></div>
<div class="nav-section">Workspace</div><nav class="nav" id="navRisk"><button class="active" data-page="dashboard" onclick="go('dashboard')"><span class="ico">▦</span>Overview</button><button data-page="screening" onclick="go('screening')"><span class="ico">◎</span>Screening queue <span class="count">4</span></button><button data-page="entities" onclick="go('entities')"><span class="ico">◇</span>Entity search</button><button data-page="cases" onclick="go('cases')"><span class="ico">▤</span>Compliance cases</button><button data-page="sources" onclick="go('sources')"><span class="ico">↗</span>Data sources</button></nav>
<nav class="nav hidden" id="navIntel"><button class="active" data-page="dashboard" onclick="go('dashboard')"><span class="ico">▦</span>Overview</button><button data-page="entities" onclick="go('entities')"><span class="ico">◇</span>Entity profiles</button><button data-page="investigations" onclick="go('investigations')"><span class="ico">⌕</span>Investigations <span class="count">3</span></button><button data-page="graph" onclick="go('graph')"><span class="ico">⌘</span>Relationship map</button><button data-page="reports" onclick="go('reports')"><span class="ico">▤</span>Briefings &amp; reports</button></nav>
<div class="sidebar-bottom"><div class="profile"><div class="avatar">A</div><div><strong>Analyst workspace</strong><small>Portfolio demo · Local prototype</small></div></div></div></aside>
<main class="main"><header class="topbar"><div class="crumb">Meridian <span style="padding:0 8px;color:#c4ccd7">/</span><b id="crumbText">Overview</b></div><div class="top-actions"><div class="search"><span class="glass">⌕</span><input id="globalSearch" placeholder="Search entities, cases, or sources…" onkeydown="if(event.key==='Enter')searchEntity()"><span class="shortcut">↵</span></div><button class="icon-btn" onclick="toast('Notifications are simulated in this demo.')" aria-label="Notifications">♧</button></div></header>
<div class="content" id="appContent"></div></main></div><div class="toast" id="toast"></div>
<script>
let mode='risk',page='dashboard',selectedEntity='Northstar Maritime Group';
const entities=[{name:'Northstar Maritime Group',type:'Shipping & logistics',country:'Panama',id:'ENT-00418',status:'Review required',risk:'Elevated',updated:'12 min ago',symbol:'N',note:'Potential ownership and routing questions require analyst review.'},{name:'Asterion Components Ltd.',type:'Industrial electronics',country:'Germany',id:'ENT-00392',status:'No potential match',risk:'Low',updated:'1 hour ago',symbol:'A',note:'No potential match in this illustrative dataset.'},{name:'Volga Meridian Trading',type:'Commodities trading',country:'Türkiye',id:'ENT-00271',status:'Potential match',risk:'High',updated:'Yesterday',symbol:'V',note:'Name similarity only. Do not treat as a confirmed sanctions match.'},{name:'Bluehaven Logistics SA',type:'Freight forwarding',country:'Uruguay',id:'ENT-00185',status:'Analyst review',risk:'Moderate',updated:'2 days ago',symbol:'B',note:'Additional identifiers recommended before disposition.'}];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function setMode(m){mode=m;document.getElementById('riskMode').classList.toggle('active',m==='risk');document.getElementById('riskMode').classList.remove('invest');document.getElementById('intelMode').classList.toggle('active',m==='intel');document.getElementById('intelMode').classList.toggle('invest',m==='intel');document.getElementById('navRisk').classList.toggle('hidden',m!=='risk');document.getElementById('navIntel').classList.toggle('hidden',m!=='intel');go('dashboard')}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let labels={dashboard:'Overview',screening:'Screening queue',entities:'Entity search',cases:'Compliance cases',sources:'Data sources',investigations:'Investigations',graph:'Relationship map',reports:'Briefings & reports',profile:'Entity profile'};document.getElementById('crumbText').textContent=labels[p]||p;render()}
function header(eyebrow,title,sub,buttons=''){return `<div class="heading-row"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><div class="subhead">${sub}</div></div><div class="actions">${buttons}</div></div>`}
function demo(){return `<div class="demo-strip"><b>◉ DEMO ENVIRONMENT</b><span>Illustrative records and risk indicators only. No live screening or production data connections are active.</span></div>`}
function btn(label,action,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${action}">${label}</button>`}
function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><div class="stat-top"><span>${x.label}</span><span class="stat-icon">${x.icon}</span></div><div class="stat-value">${x.value}</div><div class="stat-foot">${x.foot}</div></div>`).join('')}</div>`}
function entityTable(){return `<div class="panel"><div class="panel-head"><div><h2>Recent entity reviews</h2><p>Latest records across your shared intelligence workspace</p></div><button class="text-link" onclick="go('entities')">View all →</button></div><div class="table-wrap"><table><thead><tr><th>Entity</th><th>Jurisdiction</th><th>Review status</th><th>Updated</th></tr></thead><tbody>${entities.map((e,i)=>`<tr onclick="openEntity('${e.name}')" style="cursor:pointer"><td><div class="entity"><div class="entity-icon">${e.symbol}</div><div><strong>${e.name}</strong><small>${e.id} · ${e.type}</small></div></div></td><td>${e.country}</td><td><span class="pill ${e.status==='No potential match'?'green':e.status==='Potential match'?'red':'amber'}"><span class="dot"></span>${e.status}</span></td><td>${e.updated}</td></tr>`).join('')}</tbody></table></div></div>`}
function activityPanel(){return `<div class="panel"><div class="panel-head"><div><h2>${mode==='risk'?'Analyst activity':'Investigation activity'}</h2><p>Recent actions in this demo workspace</p></div><button class="text-link" onclick="toast('Activity history is sample data.')">All activity →</button></div><div class="activity">${(mode==='risk'?[['◎','Potential match flagged','Volga Meridian Trading · Name similarity detected','12 min ago'],['▤','Case updated','Northstar Maritime Group · Ownership question added','46 min ago'],['↗','Source reviewed','Illustrative consolidated-list snapshot','2 hours ago'],['◇','Entity created','Bluehaven Logistics SA','Yesterday']]:[['⌕','Investigation opened','Northstar Maritime Group · Corporate profile','12 min ago'],['⌘','Relationship added','Illustrative affiliate relationship flagged for validation','48 min ago'],['▤','Briefing drafted','Regional shipping exposure overview','2 hours ago'],['↗','Source attached','Public company registry reference','Yesterday']]).map(a=>`<div class="activity-item"><div class="activity-icon">${a[0]}</div><div class="activity-copy"><strong>${a[1]}</strong><p>${a[2]}</p><time>${a[3]}</time></div></div>`).join('')}</div></div>`}
function dashboard(){let b=mode==='risk'?header('Risk & compliance','Good afternoon, Analyst','Your screening and trade-risk work at a glance.',btn('＋ New screening',"go('screening')",true)+btn('Search entity',"go('entities')")):header('Intelligence & investigations','Your intelligence workspace','Turn public-source research into structured, traceable intelligence.',btn('＋ New investigation',"go('investigations')",true)+btn('Explore entities',"go('entities')"));let s=mode==='risk'?[{label:'Entities screened',value:'248',icon:'◎',foot:'<span class="up">+18</span> this week · demo metric'},{label:'Awaiting review',value:'12',icon:'◷',foot:'4 high-priority demo cases'},{label:'Open cases',value:'07',icon:'▤',foot:'3 require analyst follow-up'},{label:'Source coverage',value:'86%',icon:'↗',foot:'Illustrative coverage score'}]:[{label:'Active investigations',value:'08',icon:'⌕',foot:'3 with recent activity'},{label:'Entities in workspace',value:'124',icon:'◇',foot:'Shared records · demo metric'},{label:'Sources collected',value:'367',icon:'↗',foot:'URLs and source records'},{label:'Briefings drafted',value:'16',icon:'▤',foot:'5 updated this week'}];return b+demo()+stats(s)+`<div class="layout">${entityTable()}${activityPanel()}</div><div class="lower"><div class="panel"><div class="panel-head"><div><h2>${mode==='risk'?'Review distribution':'Investigation priorities'}</h2><p>${mode==='risk'?'Illustrative queue composition':'Sample workload by priority'}</p></div></div><div class="risk-bars">${(mode==='risk'?[['Potential matches',35,'amberbar'],['Ownership questions',68,''],['Country / route risk',48,'greenbar'],['Awaiting identifiers',22,'']]:[['High priority',62,'amberbar'],['Standard research',76,''],['Awaiting corroboration',45,'greenbar'],['Ready for briefing',30,'']]).map(x=>`<div class="risk-row"><div class="risk-label"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="bar"><span class="${x[2]}" style="width:${x[1]}%"></span></div></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div><h2>Connected source registry</h2><p>Source types configured for this prototype</p></div><button class="text-link" onclick="go('sources')">View sources →</button></div><div class="source-list">${[['OFAC','OFAC Sanctions List Service','Official source · not live connected'],['CSL','U.S. Consolidated Screening List','Official source · not live connected'],['OSINT','Public-source research','Manual demo references']].map(x=>`<div class="source"><div class="source-mark">${x[0]}</div><div class="source-info"><strong>${x[1]}</strong><small>${x[2]}</small></div><span class="source-status">Planned</span></div>`).join('')}</div></div></div>`}
function entitiesPage(){return header('Shared intelligence engine','Entity search','One shared record across compliance and investigations.',btn('＋ Add entity',"toast('Entity creation is a planned next step.')",true))+demo()+`<div class="panel"><div class="panel-head"><div><h2>Entity directory</h2><p>Select a record to open the shared profile</p></div><input id="entityFilter" placeholder="Filter entities…" oninput="filterEntities(this.value)" style="width:210px;border:1px solid #dce3ed;border-radius:8px;padding:8px 10px"></div><div id="entityRows">${entityTableInner()}</div></div>`}
function entityTableInner(){return `<div class="table-wrap"><table><thead><tr><th>Entity</th><th>Jurisdiction</th><th>Risk indicator</th><th>Last updated</th><th></th></tr></thead><tbody>${entities.map(e=>`<tr data-name="${e.name.toLowerCase()}" onclick="openEntity('${e.name}')" style="cursor:pointer"><td><div class="entity"><div class="entity-icon">${e.symbol}</div><div><strong>${e.name}</strong><small>${e.id} · ${e.type}</small></div></div></td><td>${e.country}</td><td><span class="pill ${e.risk==='Low'?'green':e.risk==='High'?'red':'amber'}">${e.risk}</span></td><td>${e.updated}</td><td><button class="text-link" onclick="event.stopPropagation();openEntity('${e.name}')">Open →</button></td></tr>`).join('')}</tbody></table></div>`}
function filterEntities(q){document.querySelectorAll('#entityRows tbody tr').forEach(r=>r.style.display=r.dataset.name.includes(q.toLowerCase())?'':'none')}
function openEntity(name){selectedEntity=name;page='profile';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('crumbText').textContent='Entity profile';render()}

 class="case-copy"><strong>Analyst interpretation</strong><small>Separated from verified source facts</small></div><span class="pill blue">Interpretation</span></div></div></div><div><div class="panel"><div class="panel-head"><div><h2>Relationship map</h2><p>Illustrative links only</p></div><button class="text-link" onclick="go('graph')">Expand →</button></div>${graphSVG()}</div><div class="panel" style="margin-top:17px"><div class="panel-head"><div><h2>Workspace handoff</h2><p>Continue analysis in either mode</p></div></div><div style="padding:16px;display:grid;gap:9px">${btn('◈ Review screening context',"setMode('risk');go('screening')")}${btn('⌘ Open investigation workspace',"setMode('intel');go('investigations')")}</div></div></div></div>`}
function graphSVG(){return `<div class="graph"><svg viewBox="0 0 420 290" role="img" aria-label="Illustrative relationship graph"><g stroke="#b9c8dd" stroke-width="1.5"><line x1="210" y1="140" x2="100" y2="65"/><line x1="210" y1="140" x2="320" y2="62"/><line x1="210" y1="140" x2="95" y2="220"/><line x1="210" y1="140" x2="325" y2="220"/></g><g fill="#fff" stroke="#8ca5cb" stroke-width="1.5"><circle cx="210" cy="140" r="34" fill="#eaf1ff" stroke="#6689c7"/><circle cx="100" cy="65" r="25"/><circle cx="320" cy="62" r="25"/><circle cx="95" cy="220" r="25"/><circle cx="325" cy="220" r="25"/></g><g fill="#345783" font-size="10" text-anchor="middle" font-weight="700"><text x="210" y="137">NORTHSTAR</text><text x="210" y="150" font-size="8" font-weight="500">ENTITY</text><text x="100" y="68">Owner A</text><text x="320" y="65">Affiliate B</text><text x="95" y="223">Port C</text><text x="325" y="223">Vendor D</text></g><g fill="#a1adbd" font-size="9" text-anchor="middle"><text x="143" y="92">possible link</text><text x="275" y="92">unverified</text><text x="143" y="187">route</text><text x="275" y="187">reported</text></g></svg></div><div class="graph-legend"><span><i class="legend-dot" style="background:#6689c7"></i>Primary entity</span><span><i class="legend-dot" style="background:#c2cddd"></i>Unverified relationship</span></div>`}

control</h2></div><div style="padding:18px;color:#68768a;font-size:12px;line-height:1.8">A name similarity is not a confirmed match. A production workflow must compare identifiers, apply the relevant legal rules, preserve evidence, and require an authorized analyst to make the final disposition.</div></div></div>`}

function sourcesPage(){return header('Source registry','Data sources','A source registry designed for transparent, auditable analysis.',btn('＋ Register source',"toast('Source registry editing is planned.')",true))+demo()+`<div class="layout"><div class="panel"><div class="panel-head"><div><h2>Official screening resources</h2><p>Public references for future integration</p></div></div><div class="case-row"><div class="source-mark">US</div><div class="case-copy"><strong>OFAC Sanctions List Service</strong><small>U.S. Treasury · official list downloads and search</small><a href="https://ofac.treasury.gov/sanctions-list-service" target="_blank" rel="noreferrer">Open official resource ↗</a></div><span class="pill blue">Reference</span></div><div class="case-row"><div class="source-mark">CSL</div><div class="case-copy"><strong>U.S. Consolidated Screening List</strong><small>U.S. Department of Commerce · consolidated trade screening</small><a href="https://www.trade.gov/consolidated-screening-list" target="_blank" rel="noreferrer">Open official resource ↗</a></div><span class="pill blue">Reference</span></div><div class="case-row"><div class="source-mark">OS</div><div class="case-copy"><strong>Open-source research</strong><small>Company registries, filings, official announcements and media</small></div><span class="pill amber">Manual</span></div></div><div class="panel"><div class="panel-head"><h2>Production readiness</h2></div><div class="source-list">${[['Live data ingestion','Not connected'],['Source timestamps','Schema planned'],['Licensing review','Required'],['Automated refresh','Not enabled'],['Audit trail','Prototype only']].map(x=>`<div class="source"><div class="source-info"><strong>${x[0]}</strong></div><span class="pill amber">${x[1]}</span></div>`).join('')}</div></div></div>`}
function investigationsPage(){return header('Intelligence & investigations','Investigation workspace','Structure research questions, evidence, relationships and findings.',btn('＋ New investigation',"toast('New investigation flow is planned.')",true))+demo()+`<div class="panel"><div class="panel-head"><div><h2>Active investigations</h2><p>Sample work items across the shared entity graph</p></div><button class="btn small" onclick="go('reports')">Create briefing ↗</button></div>${[['INV-024','Northstar Maritime Group','Corporate profile and ownership review','High','amber'],['INV-021','Volga Meridian Trading','Regional counterparties and identity validation','High','red'],['INV-019','Bluehaven Logistics SA','Supply-chain context and corroboration','Standard','blue']].map(x=>`<div class="case-row"><div class="activity-icon">⌕</div><div class="case-copy"><strong>${x[1]}</strong><small>${x[0]} · ${x[2]}</small></div><span class="pill ${x[4]}">${x[3]} priority</span><button class="btn small" onclick="openEntity('${x[1]}')">Open</button></div>`).join('')}</div><div class="lower"><div class="panel"><div class="panel-head"><h2>Investigation workflow</h2></div><div class="risk-bars">${[['1','Define research question'],['2','Collect and log sources'],['3','Corroborate claims'],['4','Map relationships'],['5','Draft source-cited briefing']].map(x=>`<div class="source"><div class="source-mark">${x[0]}</div><div class="source-info"><strong>${x[1]}</strong></div><span class="pill blue">Workflow</span></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h2>Evidence standards</h2></div><div style="padding:17px 20px;font-size:12px;line-height:1.8;color:#6b7a8e">Keep source-backed facts separate from analyst hypotheses. Capture dates and original URLs, seek independent corroboration, preserve contradictory evidence, and label uncertainty explicitly.</div></div></div>`}
function graphPage(){return header('Intelligence & investigations','Relationship map','Explore a shared entity graph while preserving uncertainty.',btn('← Entity profiles',"go('entities')")+btn('Add relationship',"toast('Relationship editing is planned.')",true))+demo()+`<div class="panel"><div class="panel-head"><div><h2>Northstar Maritime Group · network overview</h2><p>All connections below are fictional placeholders for interface demonstration</p></div><span class="pill amber">Unverified links</span></div>${graphSVG()}<div class="graph-legend"><span><i class="legend-dot" style="background:#6689c7"></i>Primary entity</span><span><i class="legend-dot" style="background:#c2cddd"></i>Possible relationship</span><span>Edges require source citation before use as findings</span></div></div><div class="lower"><div class="panel"><div class="panel-head"><h2>Relationship evidence</h2></div><div class="case-row"><div class="activity-icon">↔</div><div class="case-copy"><strong>Owner A → Northstar</strong><small>Relationship type: possible ownership · no source attached</small></div><span class="pill red">Unverified</span></div><div class="case-row"><div class="activity-icon">↔</div><div class="case-copy"><strong>Northstar → Affiliate B</strong><small>Relationship type: reported affiliate · requires corroboration</small></div><span class="pill amber">Research</span></div></div><div class="panel"><div class="panel-head"><h2>Graph controls</h2></div><div style="padding:18px;display:grid;gap:12px"><label style="font-size:11px;color:#68768a">Relationship confidence<select style="display:block;width:100%;padding:9px;margin-top:6px;border:1px solid #dce3ed;border-radius:7px"><option>All relationships</option><option>Verified only</option><option>Unverified only</option></select></label><label style="font-size:11px;color:#68768a">Relationship depth<select style="display:block;width:100%;padding:9px;margin-top:6px;border:1px solid #dce3ed;border-radius:7px"><option>1 degree</option><option>2 degrees</option><option>3 degrees</option></select></label><button class="btn" onclick="toast('Graph filters are a visual prototype only.')">Apply filters</button></div></div></div>`}
function reportsPage(){return header('Intelligence & investigations','Briefings & reports','Generate structured reports with source traceability and explicit caveats.',btn('＋ New briefing',"toast('Briefing builder is planned.')",true))+demo()+`<div class="panel report"><div class="eyebrow">Illustrative report preview · draft</div><h2>Corporate Intelligence Briefing</h2><p><b>Subject:</b> Northstar Maritime Group · <b>Record:</b> ENT-00418 · <b>Status:</b> Preliminary</p><div class="report-flag"><b>Important limitation:</b> This is a fictional demonstration report. It contains no verified findings about a real company and must not be used for a compliance decision.</div><h3>1. Executive summary</h3><p>The sample record contains open research questions concerning ownership context, counterparties, and shipping-route information. Available demo content is insufficient to reach a factual conclusion. Additional independent sources and entity identifiers would be required.</p><h3>2. Questions for further research</h3><ul><li>Confirm the entity's full legal name, registration number, jurisdiction, and known aliases.</li><li>Identify beneficial ownership and control using authoritative company records where available.</li><li>Corroborate reported affiliates and counterparties with dated, primary sources.</li><li>Compare any potential screening results using identifiers; do not infer a match from name similarity alone.</li></ul><h3>3. Evidence and confidence</h3><p>No verified evidence is attached in this prototype. Relationship nodes are placeholders, and no live sanctions list lookup has been performed. Confidence in any substantive conclusion is therefore insufficient.</p><h3>4. Source register</h3><p>Source URL: not attached · Publication date: unknown · Retrieval timestamp: not recorded · Analyst validation: pending.</p><button class="btn" onclick="copyReport()">Copy report text</button> <button class="btn" onclick="toast('PDF export is a future enhancement.')">Export PDF</button></div>`}
function copyReport(){let t='Corporate Intelligence Briefing — DEMO ONLY\nSubject: Northstar Maritime Group\nStatus: Preliminary; no verified findings.\nOpen questions: legal identity, ownership/control, counterparties, and routes.\nNo live screening was performed. Name similarity is not a confirmed match.\nSource register: no sources attached; validate all findings independently.';navigator.clipboard?.writeText(t).then(()=>toast('Demo report text copied.')).catch(()=>toast('Copy is unavailable in this browser.'))}
function searchEntity(){let q=document.getElementById('globalSearch').value.trim().toLowerCase();if(!q)return;let e=entities.find(e=>e.name.toLowerCase().includes(q)||e.id.toLowerCase().includes(q)||e.country.toLowerCase().includes(q));if(e){openEntity(e.name)}else{go('entities');setTimeout(()=>{let f=document.getElementById('entityFilter');if(f){f.value=q;filterEntities(q)}},0);toast('Showing entity directory results for: '+q)}}
function render(){let c=document.getElementById('appContent');let views={dashboard,entities:entitiesPage,profile:profilePage,screening:screeningPage,cases:casesPage,sources:sourcesPage,investigations:investigationsPage,graph:graphPage,reports:reportsPage};if(mode==='risk'&&['investigations','graph','reports'].includes(page))page='dashboard';if(mode==='intel'&&['screening','cases','sources'].includes(page))page='dashboard';c.innerHTML=(views[page]||dashboard)();}
